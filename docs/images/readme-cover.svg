<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none">
  <title>Jusoor — Connected care. Shared support.</title>
  <desc>A blue and teal Jusoor banner with a heart, people, and an abstract bridge, using the application's light-theme colors.</desc>
  <defs>
